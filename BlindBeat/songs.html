<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Chansons - BlindBeat</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        :root {
            --bg: #0A0A1A;
            --surface: #12122A;
            --surface-light: #1E1E40;
            --primary: #F5820D;
            --primary-light: #FF9F43;
            --accent-gold: #FFD700;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0C0;
            --border: #2A2A50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .nav {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .nav a.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .song-card {
            display: flex;
            align-items: center;
            background: var(--surface);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            gap: 15px;
        }

        .song-cover {
            width: 60px;
            height: 60px;
            border-radius: 4px;
            object-fit: cover;
        }

        .song-details {
            flex: 1;
        }

        .song-title {
            font-weight: bold;
            color: var(--text-primary);
            display: block;
        }

        .song-artist {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .count-badge {
            background: var(--surface-light);
            padding: 5px 12px;
            border-radius: 15px;
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 0.85rem;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-style: italic;
            color: var(--text-secondary);
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .filter-btn {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary-light);
            color: white;
            border-color: var(--primary-light);
        }

        .player-group {
            margin-bottom: 30px;
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .player-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-light);
        }

        .view-mode-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: bold;
            padding: 5px 10px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .mode-btn.active {
            color: var(--primary-light);
            border-bottom-color: var(--primary-light);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="icon.png" alt="BlindBeat Icon" class="app-icon">
        <h1>🎵 Chansons les plus jouées</h1>
        <p>Découvrez les hits favoris de la communauté.</p>
    </header>

    <div class="nav">
        <a href="leaderboard.html">Top Joueurs</a>
        <a href="songs.html" class="active">Top Chansons</a>
        <a href="activity.html">Activité</a>
        <a href="rooms.html">Salons</a>
    </div>

    <div class="view-mode-bar">
        <button id="modeGlobal" class="mode-btn" onclick="window.setViewMode('global')">🏆 Top Global</button>
        <button id="modePlayers" class="mode-btn active" onclick="window.setViewMode('players')">👤 Par Joueur</button>
    </div>

    <div id="filters" class="filter-bar">
        <!-- Rempli dynamiquement -->
    </div>

    <div id="content">
        <div class="loading">Analyse des salons en cours...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getDatabase, ref, get, query, limitToLast } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC6H0bm0KdUO_4K_pgZBv7aaB29JMUNvik",
        authDomain: "blindbeat-a51d5.firebaseapp.com",
        databaseURL: "https://blindbeat-a51d5-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "blindbeat-a51d5",
        storageBucket: "blindbeat-a51d5.firebasestorage.app",
        messagingSenderId: "1037778546860",
        appId: "1:1037778546860:android:003d51beb7c44ce3d5ef09",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const THEMES = [
        { id: '0', label: 'Tout' },
        { id: '132', label: 'Pop' },
        { id: '116', label: 'Rap' },
        { id: '152', label: 'Rock' },
        { id: '113', label: 'Electro' },
        { id: '165', label: 'R&B' },
        { id: '464', label: 'Metal' },
        { id: '129', label: 'Jazz' },
        { id: '98', label: 'Classique' },
        { id: '173', label: 'Film' },
    ];

    let currentGenre = '0';
    let currentViewMode = 'players';
    let allRooms = [];

    function renderFilters() {
        const filterEl = document.getElementById('filters');
        if (currentViewMode === 'players') {
            filterEl.style.display = 'none';
            return;
        }
        filterEl.style.display = 'flex';
        filterEl.innerHTML = THEMES.map(t => `
            <button class="filter-btn ${currentGenre === t.id ? 'active' : ''}"
                    onclick="window.setGenre('${t.id}')">
                ${t.label}
            </button>
        `).join('');
    }

    window.setGenre = (id) => {
        currentGenre = id;
        renderFilters();
        processData();
    };

    window.setViewMode = (mode) => {
        currentViewMode = mode;
        document.getElementById('modeGlobal').classList.toggle('active', mode === 'global');
        document.getElementById('modePlayers').classList.toggle('active', mode === 'players');
        renderFilters();
        processData();
    };

    async function loadData() {
        const content = document.getElementById('content');
        try {
            await signInAnonymously(auth);
            const roomsRef = ref(db, 'rooms');
            // On analyse plus de salons pour avoir plus de données
            const recentRoomsQuery = query(roomsRef, limitToLast(500));
            const snapshot = await get(recentRoomsQuery);

            if (snapshot.exists()) {
                snapshot.forEach(child => allRooms.push(child.val()));
            } else {
                content.innerHTML = "<div class='loading'>Aucun salon trouvé.</div>";
                return;
            }

            renderFilters();
            processData();
        } catch (error) {
            content.innerHTML = `<div class='loading'>Erreur : ${error.message}</div>`;
        }
    }

    function processData() {
        if (currentViewMode === 'global') {
            processGlobalSongs();
        } else {
            processPlayerSongs();
        }
    }

    function processGlobalSongs() {
        const content = document.getElementById('content');
        const songCounts = {};
        let roomsWithQuestions = 0;

        allRooms.forEach((room) => {
            if (currentGenre !== '0' && room.theme?.id !== currentGenre) return;

            const questions = Array.isArray(room.questions)
                ? room.questions
                : (room.questions ? Object.values(room.questions) : []);

            if (questions.length > 0) {
                roomsWithQuestions++;
                questions.forEach(q => {
                    const id = q.id || (q.trackTitle + " - " + q.trackArtist);
                    if (!id) return;
                    if (!songCounts[id]) {
                        songCounts[id] = {
                            count: 0,
                            title: q.trackTitle || "Titre inconnu",
                            artist: q.trackArtist || "Artiste inconnu",
                            cover: q.cover
                        };
                    }
                    songCounts[id].count++;
                });
            }
        });

        const sortedSongs = Object.values(songCounts)
            .sort((a, b) => b.count - a.count)
            .slice(0, 100);

        if (sortedSongs.length === 0) {
            content.innerHTML = `<div class='loading'>Aucune chanson trouvée dans les ${allRooms.length} derniers salons (${roomsWithQuestions} salons ont des questions).</div>`;
            return;
        }

        let html = `<div style="text-align: center; margin-bottom: 20px; color: var(--text-secondary); font-size: 0.8rem;">
            Analyse de ${allRooms.length} salons (${roomsWithQuestions} avec questions). ${Object.keys(songCounts).length} morceaux uniques trouvés.
        </div>`;

        sortedSongs.forEach((s) => {
            html += `
                <div class="song-card">
                    <img src="${s.cover || 'icon.png'}" class="song-cover" alt="cover" onerror="this.src='icon.png'">
                    <div class="song-details">
                        <span class="song-title">${s.title}</span>
                        <span class="song-artist">${s.artist}</span>
                    </div>
                    <div class="count-badge">${s.count} fois</div>
                </div>
            `;
        });
        content.innerHTML = html;
    }

    function processPlayerSongs() {
        const content = document.getElementById('content');
        const players = {};
        let roomsWithQuestions = 0;

        allRooms.forEach((room) => {
            const roomPlayers = room.players || {};
            const questions = Array.isArray(room.questions)
                ? room.questions
                : (room.questions ? Object.values(room.questions) : []);

            if (questions.length > 0) {
                roomsWithQuestions++;
                Object.entries(roomPlayers).forEach(([pid, pinfo]) => {
                    if (!players[pid]) {
                        players[pid] = { name: pinfo.name, avatar: pinfo.avatar, songs: {} };
                    }
                    questions.forEach(q => {
                        const sid = q.id || (q.trackTitle + " - " + q.trackArtist);
                        if (!sid) return;
                        if (!players[pid].songs[sid]) {
                            players[pid].songs[sid] = {
                                title: q.trackTitle || "Titre inconnu",
                                artist: q.trackArtist || "Artiste inconnu",
                                cover: q.cover,
                                count: 0
                            };
                        }
                        players[pid].songs[sid].count++;
                    });
                });
            }
        });

        const sortedPlayers = Object.entries(players)
            .map(([id, p]) => ({ id, ...p }))
            .sort((a, b) => Object.keys(b.songs).length - Object.keys(a.songs).length)
            .slice(0, 30);

        if (sortedPlayers.length === 0) {
            content.innerHTML = `<div class='loading'>Aucune donnée par joueur dans les ${allRooms.length} derniers salons.</div>`;
            return;
        }

        let html = `<div style="text-align: center; margin-bottom: 20px; color: var(--text-secondary); font-size: 0.8rem;">
            Analyse de ${allRooms.length} salons (${roomsWithQuestions} avec questions). ${sortedPlayers.length} joueurs actifs trouvés.
        </div>`;

        sortedPlayers.forEach(p => {
            const pSongs = Object.values(p.songs)
                .sort((a, b) => b.count - a.count)
                .slice(0, 15);

            html += `
                <div class="player-group">
                    <div class="player-header">
                        <span style="font-size: 1.5rem">${p.avatar || '🎵'}</span>
                        <span class="player-name">${p.name || "Anonyme"}</span>
                        <span style="margin-left: auto; color: var(--text-secondary); font-size: 0.8rem">
                            ${Object.keys(p.songs).length} morceaux vus
                        </span>
                    </div>
                    <div class="player-songs">
                        ${pSongs.map(s => `
                            <div class="song-card" style="padding: 5px; margin-bottom: 5px; border-color: rgba(255,255,255,0.05)">
                                <img src="${s.cover || 'icon.png'}" class="song-cover" style="width: 40px; height: 40px;" alt="cover" onerror="this.src='icon.png'">
                                <div class="song-details">
                                    <span class="song-title" style="font-size: 0.85rem">${s.title}</span>
                                    <span class="song-artist" style="font-size: 0.75rem">${s.artist}</span>
                                </div>
                                <div class="count-badge" style="font-size: 0.7rem; padding: 2px 8px;">${s.count} fois</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        });
        content.innerHTML = html;
    }

    loadData();
</script>

</body>
</html>
