<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlindBeat - Top 500 Artistes</title>
icon.png

<style>
:root{
    --bg:#0A0A1A;
    --surface:#12122A;
    --surface-light:#1E1E40;
    --primary:#F5820D;
    --primary-light:#FF9F43;
    --accent-gold:#FFD700;
    --text-primary:#FFFFFF;
    --text-secondary:#A0A0C0;
    --border:#2A2A50;
}

*{
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:var(--bg);
    color:var(--text-primary);
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:30px;
}

h1{
    color:var(--primary);
    margin-bottom:10px;
}

.subtitle{
    color:var(--text-secondary);
}

.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

input,select{
    background:var(--surface);
    color:white;
    border:1px solid var(--border);
    padding:12px;
    border-radius:8px;
}

input{
    flex:1;
    min-width:250px;
}

.stats{
    margin-bottom:20px;
    color:var(--text-secondary);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:16px;
}

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:var(--primary);
}

.rank{
    color:var(--accent-gold);
    font-weight:bold;
    font-size:18px;
}

.name{
    font-size:22px;
    font-weight:600;
    margin:8px 0;
}

.badge{
    display:inline-block;
    background:var(--primary);
    color:white;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:10px;
}

.info{
    color:var(--text-secondary);
    line-height:1.8;
}

.popularity{
    margin-top:12px;
}

.bar{
    width:100%;
    height:10px;
    border-radius:20px;
    background:#222;
    overflow:hidden;
}

.bar-inner{
    height:100%;
    background:linear-gradient(
        90deg,
        var(--primary),
        var(--primary-light)
    );
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🎵 Top 500 Artistes</h1>
    <div class="subtitle">
        Référentiel BlindBeat
    </div>
</header>

<div class="toolbar">
    <input
        type="text"
        id="search"
        placeholder="Rechercher un artiste..."
    >

    <select id="typeFilter">
        <option value="">Tous</option>
        <option value="artist">Chanteurs</option>
        <option value="group">Groupes</option>
    </select>
</div>

<div class="stats" id="stats"></div>

<div class="grid" id="cards"></div>

</div>

<script>

let artists=[];

async function loadData(){

    const response =
        await fetch("artists_top500.json");

    artists = await response.json();

    render();
}

function render(){

    const search =
        document.getElementById("search")
            .value
            .toLowerCase();

    const type =
        document.getElementById("typeFilter")
            .value;

    const filtered = artists.filter(a => {

        const matchName =
            (a.name || "")
            .toLowerCase()
            .includes(search);

        const matchType =
            !type || a.type === type;

        return matchName && matchType;
    });

    document.getElementById("stats").innerHTML =
        `${filtered.length} artiste(s) affiché(s)`;

    document.getElementById("cards").innerHTML =
        filtered.map((a,index)=>{

            const popularity =
                a.popularity || 0;

            return `
                <div class="card">

                    <div class="rank">
                        #${index + 1}
                    </div>

                    <div class="name">
                        ${a.name || ""}
                    </div>

                    <div class="badge">
                        ${
                            a.type === "group"
                            ? "Groupe"
                            : "Artiste"
                        }
                    </div>

                    <div class="info">

                        ${
                            a.country
                            ? `🌍 ${a.country}<br>`
                            : ""
                        }

                        ${
                            a.start_year
                            ? `📅 ${a.start_year}<br>`
                            : ""
                        }

                        Popularité :
                        <b>${popularity}</b>

                    </div>

                    <div class="popularity">
                        <div class="bar">
                            <div
                               class="bar-inner"
                               style="width:${popularity}%">
                            </div>
                        </div>
                    </div>

                </div>
            `;
        }).join("");
}

document
.getElementById("search")
.addEventListener("input",render);

document
.getElementById("typeFilter")
.addEventListener("change",render);

loadData();

</script>

</body>
</html>
