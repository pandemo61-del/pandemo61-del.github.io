<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>BlindBeat - Daily Events</title>

<style>

:root{
    --bg:#0A0A1A;
    --surface:#12122A;
    --surface-light:#1E1E40;
    --primary:#F5820D;
    --primary-light:#FF9F43;
    --border:#2A2A50;
    --text-primary:#FFFFFF;
    --text-secondary:#A0A0C0;
    --success:#4CAF50;
    --warning:#FF9800;
    --error:#F44336;
}

body{
    font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
    background:var(--bg);
    color:var(--text-primary);
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:30px;
}

.app-icon{
    width:80px;
    height:80px;
    border-radius:18px;
    margin-bottom:15px;
}

h1{
    color:var(--primary);
}

.nav{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.nav a{
    text-decoration:none;
    padding:8px 16px;
    border-radius:20px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-secondary);
}

.nav a.active{
    background:var(--primary);
    color:white;
}

.stats-summary{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.stat-item{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 20px;
    min-width:130px;
    text-align:center;
}

.stat-value{
    display:block;
    font-size:1.4rem;
    color:var(--primary-light);
    font-weight:bold;
}

.stat-label{
    color:var(--text-secondary);
    font-size:.75rem;
}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

input,
select{
    background:var(--surface-light);
    color:white;
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
}

.btn{
    cursor:pointer;
    padding:8px 14px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-light);
    color:white;
}

.btn:hover{
    background:var(--primary);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    padding:12px;
    background:rgba(255,255,255,0.04);
    color:var(--text-secondary);
}

td{
    padding:12px;
    border-bottom:1px solid var(--border);
}

.badge{
    padding:4px 6px;
    border-radius:4px;
    font-size:.75rem;
}

.birth{
    background:var(--success);
}

.death{
    background:var(--error);
}

.special{
    background:var(--warning);
}

.preview{
    display:none;
}

.loading{
    text-align:center;
    padding:40px;
    color:var(--text-secondary);
}

</style>
</head>
<body>
