<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllWhist - IA Stress Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .card-mini {
            width: 25px;
            height: 35px;
            border: 1px solid #ccc;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            margin-right: 2px;
            background: white;
        }
        .suit-red { color: #e11d48; }
        .suit-black { color: #1e293b; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="flex justify-between items-start mb-8">
            <div>
                <div class="flex items-center gap-4 mb-2">
                    <a href="index.html" class="text-indigo-600 hover:text-indigo-800 transition">
                        <i class="fas fa-arrow-left"></i> Admin Dashboard
                    </a>
                </div>
                <h1 class="text-3xl font-black text-slate-800">IA Stress Test</h1>
                <p class="text-slate-500">Simulation automatique de 50 parties et sauvegarde Firestore</p>
            </div>
            <div class="flex flex-col items-end gap-4">
                <div class="flex gap-2">
                    <button id="btnLogin" class="hidden bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-3 rounded-xl font-bold transition-all flex items-center gap-2">
                        <i class="fab fa-google"></i>
                        <span>Connexion</span>
                    </button>
                    <button id="runBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-indigo-200 transition-all flex items-center gap-2">
                        <i class="fas fa-play"></i>
                        <span id="btnText">Lancer la simulation</span>
                    </button>
                    <button id="deleteBtn" class="bg-rose-100 text-rose-600 hover:bg-rose-200 px-4 py-3 rounded-xl font-bold transition-all flex items-center gap-2" title="Supprimer toutes les parties de test IA">
                        <i class="fas fa-trash-alt"></i>
                        <span>Clean IA Games</span>
                    </button>
                    <button id="btnLogout" class="hidden bg-slate-200 text-slate-600 p-3 rounded-xl hover:bg-slate-300 transition" title="Déconnexion">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
                <div id="auth-status" class="text-[10px] font-bold px-3 py-1 rounded-full bg-yellow-100 text-yellow-700 uppercase tracking-wider">
                    Vérification...
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Réussites</p>
                <p id="statSuccess" class="text-3xl font-black text-emerald-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Échecs</p>
                <p id="statFail" class="text-3xl font-black text-rose-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Taux de succès</p>
                <p id="statRate" class="text-3xl font-black text-indigo-600">0%</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Simulations totales</p>
                <p id="statTotal" class="text-3xl font-black text-slate-800">0 / 50</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-800 text-white text-[10px] uppercase tracking-wider">
                        <th class="px-6 py-4 font-black">#</th>
                        <th class="px-6 py-4 font-black">Date</th>
                        <th class="px-6 py-4 font-black">Contrat</th>
                        <th class="px-6 py-4 font-black text-center">Objectif</th>
                        <th class="px-6 py-4 font-black text-center">Réalisé</th>
                        <th class="px-6 py-4 font-black">Statut</th>
                        <th class="px-6 py-4 font-black text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="resultsBody" class="divide-y divide-slate-100 text-sm">
                    <tr>
                        <td colspan="7" class="px-6 py-12 text-center text-slate-400 italic">
                            <i class="fas fa-database mr-2"></i> Chargement des parties sauvegardées...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import {
            db, auth, collection, getDocs, query, where, orderBy, limit,
            doc, setDoc, deleteDoc, onAuthStateChanged, googleProvider, signInWithPopup
        } from './firebase-config.js';

        const SYM = { 'COEUR': '♥', 'CARREAU': '♦', 'TREFLE': '♣', 'PIQUE': '♠' };
        const CONTRATS = [
            { id: 'propose', nom: 'Je propose', obj: 8 },
            { id: 'emballe', nom: "J'emballe", obj: 8 },
            { id: 'trou', nom: 'Trou', obj: 9 },
            { id: 'solo', nom: 'Solo', obj: 6 },
            { id: 'abondance', nom: 'Abondance', obj: 9 },
            { id: 'misere', nom: 'Misère', obj: 0 },
            { id: 'misere_ouverte', nom: 'Misère ouverte', obj: 0 },
            { id: 'abondance_declaree', nom: 'Abondance déclarée', obj: 13 }
        ];

        let stats = { success: 0, fail: 0, total: 0 };
        const resultsBody = document.getElementById('resultsBody');
        const runBtn = document.getElementById('runBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const btnLogin = document.getElementById('btnLogin');
        const btnLogout = document.getElementById('btnLogout');
        const authStatus = document.getElementById('auth-status');

        // Login constant for Bot
        const BOT_UID = "AI-TEST-BOT";

        // Auth management
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                authStatus.innerText = `Connecté: ${user.email || 'Admin'}`;
                authStatus.className = 'text-[10px] font-bold px-3 py-1 rounded-full bg-green-100 text-green-700 uppercase tracking-wider';
                btnLogin.classList.add('hidden');
                btnLogout.classList.remove('hidden');
                loadExistingGames();
            } else {
                authStatus.innerText = 'Accès Restreint';
                authStatus.className = 'text-[10px] font-bold px-3 py-1 rounded-full bg-red-100 text-red-700 uppercase tracking-wider';
                btnLogin.classList.remove('hidden');
                btnLogout.classList.add('hidden');
                resultsBody.innerHTML = '<tr><td colspan="7" class="px-6 py-12 text-center text-rose-500 font-bold">Veuillez vous connecter pour accéder aux données.</td></tr>';
            }
        });

        btnLogin.onclick = () => {
            signInWithPopup(auth, googleProvider).catch(err => {
                console.error("Login failed", err);
                alert("Erreur de connexion : " + err.message);
            });
        };

        btnLogout.onclick = () => {
            auth.signOut().then(() => window.location.reload());
        };

        runBtn.addEventListener('click', async () => {
            if (!auth.currentUser) return alert("Veuillez vous connecter pour sauvegarder les parties.");

            runBtn.disabled = true;
            runBtn.classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('btnText').innerText = 'Simulation en cours...';

            stats = { success: 0, fail: 0, total: 0 };
            updateStatsUI();

            for (let i = 1; i <= 50; i++) {
                const game = await simulateAndSave(i);
                addTableRow(game, true);
                updateStatsUI();
                await new Promise(r => setTimeout(r, 100)); // Small delay for visual feedback
            }

            runBtn.disabled = false;
            runBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('btnText').innerText = 'Relancer la simulation';
        });

        deleteBtn.addEventListener('click', async () => {
            if (!confirm("Supprimer TOUTES les parties identifiées comme 'AI Test' ?")) return;

            deleteBtn.disabled = true;
            const q = query(collection(db, "games"), where("isAITest", "==", true));
            const snapshot = await getDocs(q);

            let count = 0;
            for (const docSnap of snapshot.docs) {
                await deleteDoc(doc(db, "games", docSnap.id));
                count++;
            }

            alert(`${count} parties supprimées.`);
            window.location.reload();
        });

        async function loadExistingGames() {
            const q = query(collection(db, "games"), where("isAITest", "==", true), orderBy("createdAt", "desc"), limit(200));
            try {
                const snapshot = await getDocs(q);
                resultsBody.innerHTML = '';
                if (snapshot.empty) {
                    resultsBody.innerHTML = '<tr><td colspan="7" class="px-6 py-12 text-center text-slate-400 italic">Aucune partie sauvegardée</td></tr>';
                    return;
                }

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    addTableRow({ id: docSnap.id, ...data });
                    if (data.resultat?.reussite) stats.success++; else stats.fail++;
                    stats.total++;
                });
                updateStatsUI();
            } catch (e) {
                console.error(e);
                resultsBody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-rose-500">Erreur : ${e.message}</td></tr>`;
            }
        }

        function updateStatsUI() {
            document.getElementById('statSuccess').innerText = stats.success;
            document.getElementById('statFail').innerText = stats.fail;
            document.getElementById('statTotal').innerText = `${stats.total}`;
            const rate = stats.total > 0 ? Math.round((stats.success / stats.total) * 100) : 0;
            document.getElementById('statRate').innerText = `${rate}%`;
        }

        async function simulateAndSave(index) {
            const cInfo = CONTRATS[Math.floor(Math.random() * CONTRATS.length)];
            const suits = ['COEUR', 'CARREAU', 'TREFLE', 'PIQUE'];
            const atout = suits[Math.floor(Math.random() * 4)];

            // IA Performance Simulation (25% fail rate)
            const isSuccess = Math.random() > 0.25;
            let real = cInfo.obj;
            if (!isSuccess) {
                real = cInfo.obj === 0 ? 1 : Math.max(0, cInfo.obj - 2);
            } else {
                real = cInfo.obj === 0 ? 0 : cInfo.obj + 1;
            }

            // Génération de plis fictifs pour que game-detail.html fonctionne
            const mockPlis = [];
            for (let i = 0; i < 13; i++) {
                const winnerId = Math.floor(Math.random() * 4);
                mockPlis.push({
                    numero: i + 1,
                    gagnantId: winnerId,
                    cartesJouees: [0, 1, 2, 3].map(pid => ({
                        joueurId: pid,
                        carte: {
                            valeur: 2 + Math.floor(Math.random() * 12),
                            couleur: suits[Math.floor(Math.random() * 4)],
                            id: `mock-${i}-${pid}`
                        }
                    }))
                });
            }

            const now = new Date();
            const sessionGameId = `AI-${Math.random().toString(36).substring(7).toUpperCase()}`;

            // Build real-looking game data
            const gameData = {
                sessionGameId,
                varianteId: 'whist-gand',
                manche: 1,
                isAITest: true,
                userId: BOT_UID,
                createdAt: now.toISOString(),
                atout: atout,
                contrat: {
                    id: cInfo.id,
                    nom: cInfo.nom,
                    joueurId: 1, // Simulated IA
                    plisObjectif: cInfo.obj,
                    atout: atout
                },
                plis: mockPlis,
                resultat: {
                    reussite: isSuccess,
                    plisFaits: real,
                    deltaScores: [0, 0, 0, 0] // Mock
                },
                scores: [0, 0, 0, 0]
            };

            const dateStr = now.toISOString().split('T')[0];
            const timeStr = now.toTimeString().split(' ')[0].replace(/:/g, '-');
            const docId = `AI_TEST_${dateStr}_${timeStr}_${sessionGameId}`;

            await setDoc(doc(db, "games", docId), gameData);

            if (isSuccess) stats.success++; else stats.fail++;
            stats.total++;

            return { id: docId, ...gameData };
        }

        function addTableRow(game, prepend = false) {
            const row = document.createElement('tr');
            const isSuccess = game.resultat?.reussite;
            const date = new Date(game.createdAt).toLocaleTimeString();

            row.className = isSuccess ? 'bg-emerald-50/30' : 'bg-rose-50/30';
            row.id = `row-${game.id}`;
            row.innerHTML = `
                <td class="px-6 py-4 font-mono text-[10px] text-slate-400">#</td>
                <td class="px-6 py-4 text-xs text-slate-500">${date}</td>
                <td class="px-6 py-4 font-bold text-slate-700">
                    ${game.contrat?.nom} <span class="text-rose-500">${SYM[game.atout] || ''}</span>
                </td>
                <td class="px-6 py-4 text-center font-bold text-slate-400">${game.contrat?.plisObjectif}</td>
                <td class="px-6 py-4 text-center font-black ${isSuccess ? 'text-emerald-600' : 'text-rose-600'}">
                    ${game.resultat?.plisFaits}
                </td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest ${isSuccess ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                        ${isSuccess ? 'Réussi' : 'Échoué'}
                    </span>
                </td>
                <td class="px-6 py-4 text-right flex justify-end gap-2">
                    <a href="game-detail.html#id=${game.id}" class="text-indigo-600 hover:text-indigo-800 transition p-2" title="Voir l'analyse">
                        <i class="fas fa-chart-bar"></i>
                    </a>
                    <button onclick="window.deleteSingleGame('${game.id}')" class="text-slate-400 hover:text-rose-600 transition p-2" title="Supprimer">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            `;

            if (prepend && resultsBody.firstChild) {
                resultsBody.insertBefore(row, resultsBody.firstChild);
            } else {
                resultsBody.appendChild(row);
            }
        }

        // Global function for individual deletion
        window.deleteSingleGame = async (id) => {
            if (!confirm("Supprimer cette partie ?")) return;
            try {
                await deleteDoc(doc(db, "games", id));
                document.getElementById(`row-${id}`).remove();
                alert("Supprimé.");
            } catch (e) {
                alert("Erreur: " + e.message);
            }
        };
    </script>
</body>
</html>
