<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllWhist - Salle de Jeu Web</title>
</head>
<body>
    <p id="play-loading" role="status">Chargement de la salle de jeu…</p>
    <script>
        (async () => {
            const source = 'https://raw.githubusercontent.com/pandemo61-del/AllWhist/b1e04a21b34f669ae60f8838bb33bcdd48772cfa/web/play.html';
            try {
                const response = await fetch(source, { cache: 'force-cache' });
                if (!response.ok) throw new Error(`Chargement impossible (${response.status})`);
                const html = await response.text();
                if (!html.includes('function startNewGame') || !html.includes('id="btn-start"')) {
                    throw new Error('La page de jeu récupérée est incomplète.');
                }
                document.open();
                document.write(html);
                document.close();
            } catch (error) {
                console.error('Échec du chargement de la salle AllWhist :', error);
                document.body.innerHTML = `
                    <main style="font-family:system-ui,sans-serif;max-width:38rem;margin:10vh auto;padding:1.5rem;color:#1f2937">
                        <h1>La salle de jeu n’a pas pu être chargée</h1>
                        <p>Vérifiez votre connexion, puis rechargez la page. Les fichiers d’origine de la salle sont temporairement indisponibles.</p>
                        <button onclick="location.reload()" style="padding:.7rem 1rem;border:0;border-radius:.6rem;background:#047857;color:white;font-weight:700;cursor:pointer">Réessayer</button>
                    </main>`;
            }
        })();
    </script>
</body>
</html>
