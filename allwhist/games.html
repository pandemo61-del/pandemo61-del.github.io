<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllWhist Admin - Parties</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-800 text-white min-h-screen p-4">
            <div class="flex items-center gap-3 mb-8 px-2">
                <img src="assets/icon.png" class="w-10 h-10 rounded-lg shadow-lg" alt="App Icon">
                <h1 class="text-xl font-bold tracking-tight">AllWhist Admin</h1>
            </div>

            <nav class="space-y-2">
                <a href="index.html" class="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-700 transition">
                    <i class="fas fa-chart-line w-6"></i> Dashboard
                </a>
                <a href="users.html" class="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-700 transition">
                    <i class="fas fa-users w-6"></i> Utilisateurs
                </a>
                <a href="games.html" class="flex items-center gap-3 p-3 rounded-lg bg-emerald-600 text-white">
                    <i class="fas fa-gamepad w-6"></i> Parties
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <div id="file-warning" class="hidden mb-6 p-4 bg-red-100 border border-red-200 text-red-700 rounded-xl">
                <i class="fas fa-exclamation-triangle mr-2"></i>
                <strong>Attention:</strong> Cette page doit être lancée via un serveur local (ex: <code>npx serve</code>) pour que Firebase fonctionne.
            </div>
            <header class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Historique des Parties</h2>
                <div class="flex items-center gap-4">
                    <button id="btn-login" class="text-sm font-medium px-4 py-2 rounded-lg bg-emerald-500 text-white hover:bg-emerald-600 transition">
                        <i class="fab fa-google mr-2"></i> Connexion Admin
                    </button>
                    <div id="auth-status" class="text-sm font-medium px-4 py-2 rounded-full bg-yellow-100 text-yellow-700">
                        Vérification...
                    </div>
                    <button id="btn-logout" class="hidden bg-slate-200 text-slate-600 p-2 rounded-lg hover:bg-slate-300 transition" title="Se déconnecter">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                    <button onclick="window.location.reload()" class="bg-emerald-50 text-emerald-600 p-2 rounded-lg hover:bg-emerald-100 transition">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </header>

            <!-- Filter (Optionnel) -->
            <div class="mb-6 flex gap-4">
                <input type="text" id="search-uid" placeholder="Filtrer par UID Utilisateur..." class="flex-1 p-2 rounded-lg border border-gray-300 focus:outline-emerald-500">
            </div>

            <!-- Games Table -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 text-gray-500 uppercase text-xs font-bold">
                        <tr>
                            <th class="p-4 border-b">Date / Heure</th>
                            <th class="p-4 border-b">Variante</th>
                            <th class="p-4 border-b">Manche</th>
                            <th class="p-4 border-b">Utilisateur</th>
                            <th class="p-4 border-b">Résultat</th>
                            <th class="p-4 border-b text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="games-tbody" class="divide-y divide-gray-100">
                        <tr>
                            <td colspan="5" class="p-8 text-center text-gray-400">
                                <i class="fas fa-spinner fa-spin mr-2"></i> Chargement des parties...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        import { db, auth, collection, getDocs, query, orderBy, limit, onAuthStateChanged, googleProvider, signInWithPopup } from './firebase-config.js';

        const authStatus = document.getElementById('auth-status');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');

        // Check if running via file://
        if (window.location.protocol === 'file:') {
            document.getElementById('file-warning')?.classList.remove('hidden');
        }

        // Auth
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                authStatus.innerText = `Connecté: ${user.email}`;
                authStatus.className = 'text-sm font-medium px-4 py-2 rounded-full bg-green-100 text-green-700';
                btnLogin.classList.add('hidden');
                btnLogout.classList.remove('hidden');
                loadGames();
            } else {
                authStatus.innerText = 'Accès Restreint';
                authStatus.className = 'text-sm font-medium px-4 py-2 rounded-full bg-red-100 text-red-700';
                btnLogin.classList.remove('hidden');
                btnLogout.classList.add('hidden');
                document.getElementById('games-tbody').innerHTML = '<tr><td colspan="5" class="p-8 text-center text-rose-500 font-bold">Veuillez vous connecter pour accéder aux données.</td></tr>';
            }
        });

        btnLogin.onclick = () => {
            signInWithPopup(auth, googleProvider).catch(err => {
                console.error("Login failed", err);
                alert("Erreur de connexion : " + err.message);
            });
        };

        btnLogout.onclick = () => {
            auth.signOut().then(() => {
                window.location.reload();
            });
        };

        async function loadGames() {
            const tbody = document.getElementById('games-tbody');
            console.log("Loading games...");
            try {
                // Requête simplifiée (sans orderBy pour tester si c'est un problème d'index)
                const q = query(collection(db, "games"), limit(100));
                const querySnapshot = await getDocs(q);
                tbody.innerHTML = '';

                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-400">Aucune partie enregistrée.</td></tr>';
                    return;
                }

                // Trier localement au lieu de Firestore pour éviter le besoin d'index au début
                const items = querySnapshot.docs.map(doc => ({ id: doc.id, data: doc.data() }));
                items.sort((a, b) => new Date(b.data.createdAt) - new Date(a.data.createdAt));

                items.forEach(({ id, data }) => {
                    const date = new Date(data.createdAt).toLocaleString('fr-FR');
                    const reussite = data.resultat?.reussite;

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-50 transition';

                    row.innerHTML = `
                        <td class="p-4 text-sm text-gray-600">${date}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-bold uppercase tracking-wider">
                                ${data.varianteId || 'Inconnue'}
                            </span>
                        </td>
                        <td class="p-4 text-sm font-medium">Manche ${data.manche || '?'}</td>
                        <td class="p-4 font-mono text-[10px] text-gray-400">${data.userId?.slice(0,8) || 'System'}...</td>
                        <td class="p-4">
                            ${reussite !== undefined ? (
                                reussite
                                ? '<span class="text-emerald-500 font-bold"><i class="fas fa-check-circle mr-1"></i> Succès</span>'
                                : '<span class="text-rose-500 font-bold"><i class="fas fa-times-circle mr-1"></i> Échec</span>'
                            ) : '<span class="text-gray-400 italic">En cours...</span>'}
                        </td>
                        <td class="p-4 text-right">
                            <a href="game-detail.html#id=${id}" class="inline-flex items-center gap-2 px-3 py-1 bg-emerald-500 text-white rounded-lg text-xs font-bold hover:bg-emerald-600 transition">
                                <i class="fas fa-info-circle"></i> Détails
                            </a>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error("Détails de l'erreur Firestore:", error);
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-rose-500">
                    <div class="font-bold">Erreur Firestore</div>
                    <div class="text-xs mt-2 bg-rose-50 p-2 rounded border border-rose-100 font-mono">${error.code}: ${error.message}</div>
                </td></tr>`;
            }
        }
    </script>
</body>
</html>
